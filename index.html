<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jifsaw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <div class="wordmark">
      <h1 class="logo">Jifsaw</h1>
      <span class="logo-emoji">🧩</span>
    </div>
  </header>

  <section id="setup" class="setup">
    <div class="choice-group" id="themeGroup">
      <span class="choice-label"></span>
      <div class="theme-dial">
        <button type="button" class="theme-arrow" id="themePrev" aria-label="Previous theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="theme-stage" id="themeStage" role="button" tabindex="0" aria-label="Tap to start with the shown theme, arrow keys to browse">
          <div class="theme-face is-active" data-value="classic">
            <span class="theme-icon">🏆</span>
            <span class="theme-name">Classic</span>
            <span class="theme-hint">The OGs</span>
          </div>
          <div class="theme-face" data-value="trending">
            <span class="theme-icon">🔥</span>
            <span class="theme-name">Trending</span>
            <span class="theme-hint">Hot sh*t</span>
          </div>
          <div class="theme-face" data-value="random">
            <span class="theme-icon">🔮</span>
            <span class="theme-name">Random</span>
            <span class="theme-hint">Gif it a go</span>
          </div>
        </div>
        <button type="button" class="theme-arrow" id="themeNext" aria-label="Next theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <section class="topic-controls" aria-labelledby="topicHeading">
      <div class="topic-heading">
        <h2 class="topic-title" id="topicHeading">Pick your GIF vibe</h2>
        <p class="topic-intro">Choose a category, then start your puzzle.</p>
      </div>
      <div id="gifCategoryGroup" class="topic-grid" role="radiogroup" aria-label="GIF categories">
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="0" data-query="animals" data-label="Animals">
          <span class="topic-icon" aria-hidden="true">🐾</span><span class="topic-name">Animals</span>
        </button>
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="-1" data-query="anime" data-label="Anime">
          <span class="topic-icon" aria-hidden="true">🌸</span><span class="topic-name">Anime</span>
        </button>
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="-1" data-query="gaming" data-label="Gaming">
          <span class="topic-icon" aria-hidden="true">🎮</span><span class="topic-name">Gaming</span>
        </button>
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="-1" data-query="movies" data-label="Movies">
          <span class="topic-icon" aria-hidden="true">🎬</span><span class="topic-name">Movies</span>
        </button>
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="-1" data-query="nature" data-label="Nature">
          <span class="topic-icon" aria-hidden="true">🌿</span><span class="topic-name">Nature</span>
        </button>
        <button type="button" class="topic-card" role="radio" aria-checked="false" tabindex="-1" data-query="sports" data-label="Sports">
          <span class="topic-icon" aria-hidden="true">🏅</span><span class="topic-name">Sports</span>
        </button>
      </div>
      <button id="topicStartButton" class="topic-start-button" type="button" disabled>
        <span id="topicStartLabel">Choose a category to begin</span><span aria-hidden="true">→</span>
      </button>
      <div class="topic-divider" aria-hidden="true"><span>or search for a topic</span></div>
      <form id="gifSearchForm" class="topic-search">
        <label class="topic-label" for="gifSearch">Make it your own</label>
        <div class="topic-search-row">
          <div class="topic-input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="gifSearch" class="topic-input" type="search" maxlength="50" autocomplete="off" placeholder="Try cats, space, or dancing" required>
          </div>
          <button class="topic-search-button" type="submit">Search</button>
        </div>
      </form>
    </section>

<div class="choice-group" id="difficultyGroup" data-value="3x3">
      <div class="diff-slider">
        <div class="diff-track" id="diffTrack">
          <div class="diff-fill" id="diffFill"></div>
          <button type="button" class="diff-handle" id="diffHandle" role="slider"
            aria-label="Puzzle difficulty" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"
            aria-valuetext="Easy, 9 pieces" tabindex="0"></button>
        </div>
        <div class="diff-ticks">
          <button type="button" class="diff-tick-label active" data-value="3x3" data-pct="0">Easy</button>
          <button type="button" class="diff-tick-label" data-value="4x3" data-pct="50">Medium</button>
          <button type="button" class="diff-tick-label" data-value="5x4" data-pct="100">Hard</button>
        </div>
      </div>
      <p class="best-time-label" id="setupBestTime"></p>
    </div>

    <p id="searchStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </section>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="loading-spinner"><span></span><span></span><span></span><span></span></div>
      <p id="loadingText" class="loading-text" role="status" aria-live="polite">Fetching a GIF…</p>
    </div>
  </div>

  <main id="game" class="game hidden">
    <div class="game-toolbar">
      <button id="shuffleBtn" type="button" class="tool-btn" title="Shuffle"><span class="tool-icon">🔀</span>Shuffle</button>
      <button id="hintBtn" type="button" class="tool-btn" title="Toggle hint"><span class="tool-icon">💡</span>Hint</button>
      <button id="newBtn" type="button" class="tool-btn" title="New puzzle"><span class="tool-icon">↺</span>New</button>
      <button id="muteBtn" type="button" class="tool-btn icon-only" title="Mute sound" aria-pressed="false"><span class="tool-icon" id="muteIcon">🔊</span></button>
      <span class="timer-badge"><span class="tool-icon">⏱</span><span id="timer">00:00</span></span>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="pieceCount" class="progress-label">0/12 placed</span>
    </div>

    <div class="play-area">
      <div id="board"></div>
    </div>
  </main>

  <!-- Sits outside .game (and its fadeUp animation) so this stays fixed to
       the real viewport: an ancestor with a transform-touching animation —
       even a finished one with fill-mode "both" — becomes the containing
       block for position:fixed descendants, which silently breaks the
       scatter/clamp math that assumes window.innerWidth/innerHeight. -->
  <div id="tray"></div>

  <div id="winOverlay" class="win-overlay hidden">
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
    <div class="win-card">
      <div class="win-burst">🎉</div>
      <h2 class="win-title">Solved!</h2>
      <p class="win-stats">Time <strong id="winTime">00:00</strong> · <span id="winDifficulty">Medium</span></p>
      <p class="win-best" id="winBest"></p>
      <div class="win-preview"><video id="winVideo" muted loop playsinline autoplay></video></div>
      <div class="win-gif-info">
        <p class="win-gif-title" id="winGifTitle"></p>
        <p class="win-gif-desc" id="winGifDesc"></p>
        <a class="win-gif-link" id="winGifLink" href="#" target="_blank" rel="noopener">View on GIPHY ↗</a>
      </div>
      <div class="win-actions">
        <button type="button" id="playAgainBtn" class="win-btn primary">🔁 Play Again</button>
        <button type="button" id="newThemeBtn" class="win-btn">🎲 New GIF</button>
      </div>
    </div>
  </div>

  <video id="src" muted loop playsinline style="display:none"></video>

  <script src="giphy.js?v=5"></script>
  <script src="confetti.js"></script>
  <script src="sound.js?v=2"></script>
  <script src="storage.js"></script>
  <script src="puzzle.js?v=12"></script>
  <script src="app.js?v=14"></script>

  <footer class="site-footer">
    <p><a href="https://gtbr.co.uk/" target="_blank" rel="noopener">GTBR</a> side-quest 🪿 · Powered by <a href="https://giphy.com/" target="_blank" rel="noopener">GIPHY</a></p>
  </footer>
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "482a7367c95f49cc9a311fe30b217023"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
