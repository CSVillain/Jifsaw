<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jifsaw — A jigsaw that won't sit still</title>
<meta name="description" content="A jigsaw puzzle made from GIFs. Pick a theme, choose your difficulty, and piece it together while the picture keeps moving. Play Jifsaw in your browser.">
<link rel="canonical" href="https://jifsaw.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Jifsaw">
<meta property="og:url" content="https://jifsaw.com/">
<meta property="og:title" content="Jifsaw — A jigsaw that won't sit still">
<meta property="og:description" content="A jigsaw puzzle made from GIFs. The pieces move. The picture moves. Good luck.">
<meta property="og:image" content="https://jifsaw.com/assets/jifsaw-social-v1.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Jifsaw. A jigsaw that won't sit still. A colourful looping ribbon split into interlocking puzzle pieces.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Jifsaw — A jigsaw that won't sit still">
<meta name="twitter:description" content="A jigsaw puzzle made from GIFs. The pieces move. The picture moves. Good luck.">
<meta name="twitter:image" content="https://jifsaw.com/assets/jifsaw-social-v1.png">
<meta name="twitter:image:alt" content="Jifsaw. A jigsaw that won't sit still. A colourful looping ribbon split into interlocking puzzle pieces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <div class="wordmark">
      <h1 class="logo" aria-label="Jifsaw">
        <span aria-hidden="true">J</span><span aria-hidden="true">i</span><span aria-hidden="true">f</span><span aria-hidden="true">s</span><span aria-hidden="true">a</span><span aria-hidden="true">w</span>
      </h1>
      <span class="logo-emoji" aria-hidden="true">🧩</span>
    </div>
  </header>

  <section id="setup" class="setup">
    <div class="source-layout" data-setup-controls>
      <div id="gifSource" class="source-dial" role="group" aria-label="GIF source">
        <button type="button" class="source-arrow" id="sourcePrevious" aria-label="Previous GIF theme">
          <span aria-hidden="true">‹</span>
        </button>
        <div id="gifSourceFace" class="source-current" aria-live="polite" aria-atomic="true">
          <span id="gifSourceIcon" class="source-icon" aria-hidden="true">🏆</span>
          <span id="activeSource">Classic</span>
        </div>
        <button type="button" class="source-arrow" id="sourceNext" aria-label="Next GIF theme">
          <span aria-hidden="true">›</span>
        </button>
      </div>
      <button type="button" id="openSourcePicker" class="source-browse" aria-haspopup="dialog">
        <span aria-hidden="true"></span> Categories &amp; search
      </button>
      <dialog id="sourcePicker" class="source-picker" aria-labelledby="sourcePickerTitle">
        <header class="source-picker-header">
          <h2 id="sourcePickerTitle">GIF categories</h2>
          <button type="button" id="closeSourcePicker" class="source-close" aria-label="Close GIF categories" autofocus>×</button>
        </header>
        <form id="gifSearchForm" class="topic-search" role="search" aria-label="GIF search">
          <label class="topic-label" for="gifSearch">Search GIFs</label>
          <div class="topic-search-row">
            <input id="gifSearch" class="topic-input" type="search" maxlength="50" autocomplete="off" enterkeyhint="done" placeholder="Try cats or space">
            <button type="submit" class="topic-submit" aria-label="Apply search">→</button>
          </div>
          <p id="gifSearchStatus" class="status error" role="status"></p>
        </form>
        <div class="category-grid" role="group" aria-label="GIF topic categories">
          <button type="button" class="category-option" data-topic="animals" aria-pressed="false"><span aria-hidden="true">🦊</span>Animals</button>
          <button type="button" class="category-option" data-topic="anime" aria-pressed="false"><span aria-hidden="true">✨</span>Anime</button>
          <button type="button" class="category-option" data-topic="gaming" aria-pressed="false"><span aria-hidden="true">🎮</span>Gaming</button>
          <button type="button" class="category-option" data-topic="movies" aria-pressed="false"><span aria-hidden="true">🎬</span>Movies</button>
          <button type="button" class="category-option" data-topic="nature" aria-pressed="false"><span aria-hidden="true">🌿</span>Nature</button>
          <button type="button" class="category-option" data-topic="sports" aria-pressed="false"><span aria-hidden="true">⚽</span>Sports</button>
        </div>
      </dialog>
    </div>

    <div class="setup-footer" data-setup-controls>
      <div class="choice-group" id="difficultyGroup" data-value="3x3" role="group" aria-label="Choose puzzle difficulty">
        <div class="diff-slider">
          <div class="diff-track" id="diffTrack">
            <div class="diff-fill" id="diffFill"></div>
            <button type="button" class="diff-handle" id="diffHandle" role="slider"
              aria-label="Puzzle difficulty" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"
              aria-valuetext="Easy, 9 pieces" tabindex="0"></button>
          </div>
          <div class="diff-ticks">
            <button type="button" class="diff-tick-label active" data-value="3x3" data-pct="0">Easy</button>
            <button type="button" class="diff-tick-label" data-value="4x3" data-pct="50">Medium</button>
            <button type="button" class="diff-tick-label" data-value="5x4" data-pct="100">Hard</button>
          </div>
        </div>
        <p class="best-time-label" id="setupBestTime"></p>
      </div>
      <button type="button" id="startPuzzleBtn" class="start-puzzle-button">Start puzzle <span aria-hidden="true">→</span></button>
    </div>

    <p id="searchStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </section>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="loading-spinner"><span></span><span></span><span></span><span></span></div>
      <p id="loadingText" class="loading-text" role="status" aria-live="polite">Fetching a GIF…</p>
    </div>
  </div>

  <main id="game" class="game hidden">
    <div class="game-toolbar">
      <button id="shuffleBtn" type="button" class="tool-btn" title="Shuffle"><span class="tool-icon">🔀</span>Shuffle</button>
      <button id="hintBtn" type="button" class="tool-btn" title="Toggle hint"><span class="tool-icon">💡</span>Hint</button>
      <button id="newBtn" type="button" class="tool-btn" title="New puzzle"><span class="tool-icon">↺</span>New</button>
      <button id="muteBtn" type="button" class="tool-btn icon-only" title="Mute sound" aria-pressed="false"><span class="tool-icon" id="muteIcon">🔊</span></button>
      <span class="timer-badge"><span class="tool-icon">⏱</span><span id="timer">00:00</span></span>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="pieceCount" class="progress-label">0/12 placed</span>
    </div>

    <div class="play-area">
      <div id="board"></div>
    </div>
  </main>

  <!-- Sits outside .game (and its fadeUp animation) so this stays fixed to
       the real viewport: an ancestor with a transform-touching animation —
       even a finished one with fill-mode "both" — becomes the containing
       block for position:fixed descendants, which silently breaks the
       scatter/clamp math that assumes window.innerWidth/innerHeight. -->
  <div id="tray"></div>

  <div id="winOverlay" class="win-overlay hidden">
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
    <div class="win-card">
      <div class="win-burst">🎉</div>
      <h2 class="win-title">Solved!</h2>
      <p class="win-stats">Time <strong id="winTime">00:00</strong> · <span id="winDifficulty">Medium</span></p>
      <p class="win-best" id="winBest"></p>
      <div class="win-preview"><video id="winVideo" muted loop playsinline autoplay></video></div>
      <div class="win-gif-info">
        <p class="win-gif-title" id="winGifTitle"></p>
        <p class="win-gif-desc" id="winGifDesc"></p>
        <a class="win-gif-link" id="winGifLink" href="#" target="_blank" rel="noopener">View on GIPHY ↗</a>
      </div>
      <div class="win-actions">
        <button type="button" id="playAgainBtn" class="win-btn primary">🔁 Play Again</button>
        <button type="button" id="newThemeBtn" class="win-btn">🎲 New GIF</button>
      </div>
    </div>
  </div>

  <video id="src" muted loop playsinline style="display:none"></video>

<script src="giphy.js?v=6"></script>
  <script src="confetti.js"></script>
  <script src="sound.js?v=2"></script>
  <script src="storage.js?v=2"></script>
  <script src="puzzle.js?v=13"></script>
<script src="app.js?v=21"></script>

  <footer class="site-footer">
    <p><a href="https://gtbr.co.uk/" target="_blank" rel="noopener">GTBR</a> side-quest 🪿 · Powered by <a href="https://giphy.com/" target="_blank" rel="noopener">GIPHY</a></p>
  </footer>
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "482a7367c95f49cc9a311fe30b217023"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
