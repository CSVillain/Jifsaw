<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gifsaw</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <h1 class="logo"><span class="logo-emoji">🧩</span>Gifsaw</h1>
    <p class="subtitle">Smash a GIF into pieces. Put it back together.</p>
  </header>

  <section id="setup" class="setup">
    <div class="choice-group" id="difficultyGroup" data-value="4x3">
      <span class="choice-label">Difficulty</span>
      <div class="choice-row">
        <button type="button" class="choice" data-value="3x3">
          <span class="choice-icon">🟢</span><span class="choice-text">Easy</span>
        </button>
        <button type="button" class="choice selected" data-value="4x3">
          <span class="choice-icon">🟡</span><span class="choice-text">Medium</span>
        </button>
        <button type="button" class="choice" data-value="5x4">
          <span class="choice-icon">🔴</span><span class="choice-text">Hard</span>
        </button>
      </div>
    </div>

    <div class="choice-group" id="themeGroup">
      <span class="choice-label">Pick a GIF</span>
      <div class="choice-row">
        <button type="button" class="choice theme" data-value="classic">
          <span class="choice-icon">🎬</span><span class="choice-text">Classic</span>
        </button>
        <button type="button" class="choice theme" data-value="trending">
          <span class="choice-icon">🔥</span><span class="choice-text">Trending</span>
        </button>
        <button type="button" class="choice theme" data-value="random">
          <span class="choice-icon">🎲</span><span class="choice-text">Random</span>
        </button>
      </div>
    </div>

    <details class="api-key-row">
      <summary>Giphy API key (required — free, instant at developers.giphy.com)</summary>
      <input id="apiKeyInput" type="text" placeholder="Paste your Giphy API key">
      <button type="button" id="saveKeyBtn">Save key</button>
      <span id="keyStatus"></span>
    </details>
    <p id="searchStatus" class="status"></p>
  </section>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-card">
      <div class="loading-spinner"><span></span><span></span><span></span><span></span></div>
      <p id="loadingText" class="loading-text">Fetching a GIF…</p>
    </div>
  </div>

  <main id="game" class="game hidden">
    <div class="game-toolbar">
      <button id="shuffleBtn" type="button" class="tool-btn" title="Shuffle"><span class="tool-icon">🔀</span>Shuffle</button>
      <button id="hintBtn" type="button" class="tool-btn" title="Toggle hint"><span class="tool-icon">💡</span>Hint</button>
      <button id="newBtn" type="button" class="tool-btn" title="New puzzle"><span class="tool-icon">↺</span>New</button>
      <span class="timer-badge"><span class="tool-icon">⏱</span><span id="timer">00:00</span></span>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="pieceCount" class="progress-label">0/12 placed</span>
    </div>

    <div class="play-area">
      <div id="board"></div>
      <div id="tray"></div>
    </div>
  </main>

  <div id="winOverlay" class="win-overlay hidden">
    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>
    <div class="win-card">
      <div class="win-burst">🎉</div>
      <h2 class="win-title">Solved!</h2>
      <p class="win-stats">Time <strong id="winTime">00:00</strong> · <span id="winDifficulty">Medium</span></p>
      <div class="win-preview"><video id="winVideo" muted loop playsinline autoplay></video></div>
      <div class="win-actions">
        <button type="button" id="playAgainBtn" class="win-btn primary">🔁 Play Again</button>
        <button type="button" id="newThemeBtn" class="win-btn">🎲 New GIF</button>
      </div>
    </div>
  </div>

  <video id="src" muted loop playsinline style="display:none"></video>

  <script src="giphy.js"></script>
  <script src="confetti.js"></script>
  <script src="puzzle.js"></script>
  <script src="app.js"></script>
</body>
</html>
